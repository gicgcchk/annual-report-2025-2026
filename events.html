<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>GCC Events | Annual Report 2025–2026</title>
<style>
:root{
  --navy:#073a70; --navy-deep:#062750; --blue:#0867ae; --ink:#153150;
  --muted:#5c7087; --fog:rgba(248,251,255,.91);
  --shadow:0 19px 55px rgba(9,32,54,.18);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overscroll-behavior:none}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#71899c;overflow:hidden}
button,input,a{font:inherit}
button{cursor:pointer}
a{color:inherit}
.bg-photo{position:fixed;inset:0;z-index:-2;background:url('assets/6c56d62089bec4f386f9.jpg') center center/cover no-repeat}
.bg-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(232,245,253,.14),rgba(9,46,88,.10) 58%,rgba(231,226,213,.1));}
.app{height:100dvh;min-height:500px;max-width:2100px;margin:0 auto;padding:19px 25px 56px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex:0 0 auto;min-height:95px}
.heading-card{background:rgba(255,252,251,.85);border:1px solid rgba(255,255,255,.85);border-radius:21px;padding:14px 23px 14px 22px;box-shadow:0 6px 23px rgba(9,45,77,.09);backdrop-filter:blur(12px)}
.heading-card h1{font-size:clamp(35px,3.5vw,60px);letter-spacing:-.055em;color:#003b80;line-height:1;margin:0;font-weight:800}
.heading-card p{margin:8px 0 0;font-size:11px;letter-spacing:.24em;color:#075582;font-weight:800}
.top-actions{display:flex;align-items:center;gap:8px;margin-top:20px}
.top-actions button{border:1px solid rgba(3,55,101,.10);border-radius:24px;background:rgba(253,254,255,.91);color:var(--navy);padding:10px 13px;font-size:12px;font-weight:700;box-shadow:0 3px 11px rgba(0,30,50,.08);white-space:nowrap}
.top-actions button:hover{background:#fff;transform:translateY(-1px)}
.layout{min-height:0;flex:1;display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:stretch}
.sidebar,.map-card{border:1px solid rgba(255,255,255,.83);border-radius:23px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.sidebar{background:rgba(250,252,254,.91);padding:18px 13px 13px;overflow-y:auto;min-height:0;scrollbar-width:thin}
.panel-eyebrow{color:#55728e;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.sidebar-head{padding:0 8px 14px}
.sidebar-head h2{font-size:19px;color:var(--navy-deep);letter-spacing:-.035em;margin:7px 0 4px}
.sidebar-head p{font-size:11px;line-height:1.55;color:var(--muted);margin:0}
.search-box{margin:0 7px 14px;position:relative}
.search-box svg{position:absolute;left:11px;top:12px;width:16px;height:16px;stroke:#7390a8;fill:none;stroke-width:2}
.search-box input{width:100%;height:40px;border:1px solid #d8e3ec;border-radius:12px;background:rgba(255,255,255,.96);padding:0 10px 0 34px;outline:none;color:#0b416e;font-size:12px}
.search-box input:focus{border-color:#5185b1;box-shadow:0 0 0 3px rgba(44,122,181,.12)}
.route-list{display:grid;gap:5px}
.route-item{border:1px solid transparent;display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:transparent;border-radius:13px;padding:9px 8px;color:var(--ink);transition:background .17s,transform .17s,border .17s}
.route-item:hover,.route-item.active{background:rgba(230,239,248,.94);border-color:rgba(8,58,112,.09)}
.route-item:hover{transform:translateX(2px)}
.route-item .line-swatch{width:7px;height:39px;border-radius:6px;background:var(--route-color);flex:0 0 7px;box-shadow:0 0 0 2px #fff}
.route-item .line-label{min-width:0;flex:1}
.route-item .line-label strong{display:block;color:#122f50;font-size:11.5px;line-height:1.25;letter-spacing:-.012em}
.route-item .line-label small{display:block;color:#6b8095;margin-top:3px;font-size:10px;line-height:1.24}
.route-item .count{font-weight:800;font-size:10px;min-width:25px;text-align:center;border-radius:10px;background:#f0f5f8;color:#48708e;padding:4px}
.all-routes{margin:2px 6px 12px;width:calc(100% - 12px);border:1px solid #c7d8e6;border-radius:11px;background:#fff;font-weight:800;color:#0c5286;font-size:11px;padding:10px}
.all-routes:hover,.all-routes.active{background:#e9f3fa}
.legend-foot{margin:14px 8px 3px;font-size:10px;line-height:1.5;color:#71849a}
.map-card{position:relative;background:rgba(249,252,254,.87);overflow:hidden;min-width:0;display:flex;flex-direction:column;min-height:0}
.map-head,.map-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
.map-head{min-height:51px;padding:12px 20px 11px;border-bottom:1px solid rgba(24,72,107,.09);background:rgba(255,255,255,.35)}
.map-head strong{font-size:11px;color:#0b5586;letter-spacing:.14em;text-transform:uppercase}
.map-head span{font-size:10px;font-weight:700;color:#7690a5;letter-spacing:.08em;text-transform:uppercase}
.map-viewport{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background:linear-gradient(150deg,rgba(233,246,251,.46),rgba(255,255,255,.33) 55%,rgba(228,242,247,.52))}
.map-viewport.grabbing{cursor:grabbing}
.map-world{position:absolute;top:0;left:0;width:1720px;height:800px;transform-origin:top left;will-change:transform}
.map-illustration{position:absolute;inset:0;width:1720px;height:800px;overflow:visible;pointer-events:none}
.landform{fill:#e4eff0;opacity:.48}
.landform.pale{fill:#f5f1e9;opacity:.57}
.region-name{font-size:26px;fill:#b9cdd4;letter-spacing:.18em;font-weight:800;opacity:.58}
.water-name{display:none}
.hk-silhouette{fill:#b4d3da;stroke:#9dc2ce;stroke-width:2.2;stroke-linejoin:round;opacity:.25;pointer-events:none}
.hk-silhouette path{vector-effect:non-scaling-stroke}

.track-shadow{fill:none;stroke:rgba(255,255,255,.97);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.track{fill:none;stroke:var(--route-color);stroke-width:8.5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s ease,filter .2s ease}
.track.dim{opacity:.15}
.track.focused{stroke-width:10;filter:drop-shadow(0 2px 3px rgba(0,0,0,.14))}
.interchange>circle:first-child{fill:#fff;stroke:#57758f;stroke-width:2.4}
.interchange>circle:last-child{fill:#e0ecf3;stroke:none}
.interchange{pointer-events:none}
.interchange.dim{opacity:.2}
.station{position:absolute;width:30px;height:30px;padding:0;transform:translate(-50%,-50%);border:0;background:transparent;display:block;cursor:pointer;color:#1e4563;z-index:5;overflow:visible;transition:opacity .18s ease}
.station-marker{position:absolute;width:20px;height:20px;left:5px;top:5px;border:4px solid var(--route-color);background:#fff;border-radius:50%;box-shadow:0 0 0 3px #fff,0 3px 7px rgba(6,46,74,.15);transition:transform .16s ease,box-shadow .16s ease}
.station:hover,.station:focus-visible,.station.selected{z-index:9}
.station:hover .station-marker,.station:focus-visible .station-marker{transform:scale(1.24);box-shadow:0 0 0 4px #fff,0 0 0 8px color-mix(in srgb,var(--route-color) 30%,transparent),0 3px 8px rgba(6,46,74,.18)}
.station.selected .station-marker{transform:scale(1.24);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--route-color),0 0 0 13px rgba(255,255,255,.45)}
.station:focus-visible{outline:none}
.station .station-label{position:absolute;display:block;min-width:0;max-width:165px;width:max-content;padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.69);color:#204768;font-weight:700;font-size:16px;line-height:1.12;box-shadow:0 1px 5px rgba(12,53,82,.06);text-align:center;white-space:normal;overflow-wrap:normal;transition:opacity .18s,background .18s}
.station .station-label strong{font-weight:800}
.station .station-label small{display:block;font-size:12px;color:#5d7a93;font-weight:700;margin-top:2px}
.station[data-side="above"] .station-label{left:15px;bottom:38px;transform:translateX(-50%)}
.station[data-side="below"] .station-label{left:15px;top:38px;transform:translateX(-50%)}
.station[data-side="left"] .station-label{right:38px;top:15px;transform:translateY(-50%);text-align:right}
.station[data-side="right"] .station-label{left:38px;top:15px;transform:translateY(-50%);text-align:left}
.station:hover .station-label,.station:focus-visible .station-label,.station.selected .station-label{background:#fff;color:#073c71;box-shadow:0 3px 15px rgba(8,48,88,.18)}
.station.dim{opacity:.20;z-index:1}
.station.dim .station-label{opacity:.10;pointer-events:none}
.station-label.crowded{opacity:0!important;pointer-events:none!important}
.station:hover .station-label.crowded,.station:focus-visible .station-label.crowded,.station.selected .station-label.crowded{opacity:1!important}
.terminal-pill{font-size:14px;fill:#fff;font-weight:900;letter-spacing:.02em;pointer-events:none}
.terminal-label{fill:#607e92;font-size:12px;letter-spacing:.08em;font-weight:800;pointer-events:none}
.map-tooltip{position:absolute;display:none;z-index:30;pointer-events:none;max-width:270px;background:#fff;border:1px solid #dae6ef;border-left:5px solid var(--tooltip-color,#237aa6);border-radius:12px;box-shadow:0 11px 30px rgba(4,35,69,.22);padding:10px 12px 11px}
.map-tooltip.show{display:block}
.map-tooltip small{display:block;font-weight:800;color:#6286a1;font-size:10px;margin-bottom:4px;letter-spacing:.04em}
.map-tooltip strong{display:block;font-size:13px;line-height:1.28;color:#0a355c}
.map-foot{min-height:44px;background:rgba(255,255,255,.56);border-top:1px solid rgba(20,74,111,.09);padding:6px 13px 6px 18px}
.map-foot .hint{font-size:10.5px;color:#506e88;line-height:1.35}
.map-foot .hint strong{color:#0f5286}
.zoom-controls{display:flex;gap:4px;align-items:center}
.zoom-controls button{border:1px solid #d1dfe9;background:#fff;color:#0f5385;border-radius:8px;width:30px;height:29px;font-weight:800;font-size:17px;box-shadow:0 2px 6px rgba(5,43,79,.04)}
.zoom-controls button.fit{width:auto;padding:0 10px;font-size:11px}
.zoom-controls button:hover{background:#eaf4fb}
.detail-drawer{display:flex;flex-direction:column;position:absolute;top:9px;right:10px;bottom:9px;width:min(405px,45%);z-index:26;min-width:300px;background:rgba(255,255,255,.98);border:1px solid rgba(224,234,241,.94);border-radius:18px;box-shadow:0 15px 50px rgba(5,33,61,.24);overflow:hidden;transform:translateX(calc(100% + 25px));opacity:0;pointer-events:none;transition:transform .27s ease,opacity .22s ease}
.detail-drawer.open{transform:translateX(0);opacity:1;pointer-events:auto}
.drawer-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 15px 13px 18px;border-bottom:1px solid #e7edf2;flex:0 0 auto}
.drawer-route{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#3d617d;font-weight:850}
.drawer-route:before{content:"";background:var(--detail-color,#237bac);height:19px;width:5px;border-radius:4px}
.drawer-close{width:32px;height:32px;border:1px solid #d9e4ec;border-radius:50%;background:#fff;color:#355d7e;font-size:21px;line-height:1}
.drawer-scroll{overflow-y:auto;padding:16px 19px 20px;scrollbar-width:thin;overscroll-behavior:contain}
.drawer-date{font-size:11px;color:#70849a;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.drawer-title{font-size:clamp(21px,1.7vw,28px);letter-spacing:-.027em;line-height:1.12;color:#073a70;margin:10px 0 13px}
.drawer-qualifier{display:inline-block;padding:5px 10px;background:#eef4f7;border-radius:8px;color:#4a677b;font-size:11px;font-weight:700;margin-bottom:13px}
.drawer-gallery{margin:2px 0 17px;position:relative;border-radius:11px;overflow:hidden;background:#e6edf1}
.drawer-gallery img{display:block;object-fit:cover;width:100%;height:auto;max-height:230px;aspect-ratio:16/10}
.drawer-gallery .gallery-prev,.drawer-gallery .gallery-next{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.91);color:#073a70;width:28px;height:30px;border-radius:8px;font-size:21px}
.drawer-gallery .gallery-prev{left:8px}.drawer-gallery .gallery-next{right:8px}
.drawer-gallery .gallery-count{position:absolute;bottom:9px;right:9px;background:rgba(255,255,255,.9);padding:4px 6px;border-radius:6px;font-size:10px;color:#234863;font-weight:800}
.drawer-section{margin:17px 0 0}
.drawer-section h3{margin:0 0 7px;text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:#0e6194;font-weight:850}
.drawer-section p{white-space:pre-line;font-size:13px;color:#354e63;line-height:1.65;margin:0}
.drawer-speakers{list-style:none;padding:0;margin:0;font-size:11.5px;line-height:1.47;color:#45627a}
.drawer-speakers li{margin:0 0 6px;padding-left:11px;border-left:2px solid #d4e5f1}
.drawer-link{display:flex;align-items:center;justify-content:space-between;background:#073f78;color:#fff;text-decoration:none;border-radius:10px;margin-top:20px;padding:12px 13px;font-weight:800;font-size:12px}
.drawer-link:hover{background:#0e5d9e}
.drawer-link[hidden],.drawer-gallery[hidden],.drawer-section[hidden],.drawer-qualifier[hidden]{display:none!important}
.page-next{position:fixed;z-index:65;right:25px;bottom:13px;display:inline-flex;gap:11px;align-items:center;padding:12px 18px;border-radius:24px;background:#074b8c;color:#fff;border:1px solid rgba(255,255,255,.32);font-size:12px;font-weight:800;text-decoration:none;box-shadow:0 9px 19px rgba(0,41,88,.23);transition:transform .2s,background .2s}
.page-next:hover{transform:translateY(-2px);background:#06346b}
.page-next .arrow{font-size:16px}
.search-message{margin:7px 8px;padding:9px;background:#eff7fa;border-radius:9px;font-size:11px;line-height:1.35;color:#47718b;display:none}
.search-message.show{display:block}
@media(max-width:1180px){.layout{grid-template-columns:225px minmax(0,1fr);gap:12px}.sidebar{padding:13px 9px}.heading-card h1{font-size:44px}.route-item .line-label strong{font-size:10.5px}.route-item{padding:8px 5px}.detail-drawer{width:min(390px,53%)}.app{padding:13px 14px 52px;gap:10px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* Map station naming hierarchy: a featured event stands out on each coloured route. */
.station .station-label{max-width:178px;font-size:15px;line-height:1.13;font-weight:750;padding:5px 8px;background:rgba(255,255,255,.84)}
.station.featured{z-index:7}
.station.featured .station-marker{width:22px;height:22px;left:4px;top:4px;box-shadow:0 0 0 3px #fff,0 0 0 5px color-mix(in srgb,var(--route-color) 28%,transparent)}
.station.featured .station-label{max-width:252px;font-size:20px;font-weight:900;line-height:1.17;color:#07375a;background:rgba(255,255,255,.96);padding:8px 12px;border-left:5px solid var(--route-color);box-shadow:0 5px 16px rgba(14,56,83,.11)}
.station.featured .station-label strong{font-weight:900}

/* Stand-alone full-directory PDF download; no changes to the map or its interactions. */

/* Shared event viewer in the map and the Germany events column. */

  n.classList.toggle('dim',!matched);if(matched)count++;
 });
 document.querySelectorAll('.track').forEach(p=>{p.classList.toggle('dim',!!activeRoute&&p.parentNode.dataset.route!==activeRoute);p.classList.toggle('focused',!!activeRoute&&p.parentNode.dataset.route===activeRoute)});
 document.querySelectorAll('.interchange').forEach(n=>n.classList.toggle('dim',!!activeRoute));
 const status=searchQuery ? `${count} MATCH${count===1?'':'ES'}` : activeRoute ? `${eventsByLine[activeRoute].length} STATIONS / ${routeById[activeRoute].category.toUpperCase()}` : `${events.length} STATIONS / ${routeDefs.length} LINES`;
 const mapStatus=document.getElementById('mapStatus');if(mapStatus)mapStatus.textContent=status;
 const msg=document.getElementById('searchMessage');
 msg.classList.toggle('show',!!searchQuery);msg.textContent=searchQuery?`${count} matching event${count===1?'':'s'}. Select an available station to explore its photos or review.`:'';
 hideTip();requestAnimationFrame(declutterLabels);
}
function paintTip(node,event){
 const col=routeById[event.line].color;
 tip.style.setProperty('--tooltip-color',col);
 tip.innerHTML=`<small>${escapeText(event.date)} · ${escapeText(routeById[event.line].category)}</small><strong>${escapeText(event.stationName)}</strong>`;
 tip.classList.add('show');
 const r=node.getBoundingClientRect(),p=mapViewport.getBoundingClientRect();
 const w=tip.offsetWidth,h=tip.offsetHeight;
 let x=r.left-p.left+25,y=r.top-p.top-h-8;
 if(x+w>p.width-10)x=r.left-p.left-w-15;
 if(x<6)x=6;if(y<7)y=r.bottom-p.top+8;
 tip.style.left=x+'px';tip.style.top=y+'px';
}

function setGallery(e,index){galleryIndex=index;const photos=e.photos||[];if(!photos.length)return;
 document.getElementById('detailPhoto').src=photos[index];document.getElementById('detailPhoto').alt=e.photoAlts?.[index]||'Photo from '+e.title;document.getElementById('galleryCount').textContent=`${index+1} / ${photos.length}`;document.getElementById('galleryCount').hidden=photos.length<2;
}
function openDetails(e){
 if(!hasEventDetails(e))return;
 activeEvent=e;const def=routeById[e.line];hideTip();
 document.querySelectorAll('.station').forEach(n=>n.classList.toggle('selected',n.dataset.id===e.id));
 drawer.style.setProperty('--detail-color',def.color);
 document.getElementById('detailRoute').textContent=def.category;
 document.getElementById('detailDate').textContent=e.date;
 document.getElementById('detailTitle').textContent=e.title;
 const qualifier=document.getElementById('detailQualifier');
 qualifier.hidden=!e.qualifier;qualifier.textContent=e.qualifier||'';
 document.getElementById('detailDescription').textContent=e.description||'';
 document.getElementById('descSection').hidden=!e.description;
 const speakers=document.getElementById('detailSpeakers');speakers.innerHTML='';
 for(const s of (e.speakers||[]).slice(0,3)){const li=document.createElement('li');li.textContent=s;speakers.appendChild(li)}
 document.getElementById('speakersSection').hidden=!e.speakers?.length;
 const gallery=document.getElementById('detailGallery');const photos=e.photos||[];
 gallery.hidden=!photos.length;if(photos.length){setGallery(e,0);document.getElementById('galleryPrev').hidden=photos.length<2;document.getElementById('galleryNext').hidden=photos.length<2}
 const link=document.getElementById('detailLink');link.hidden=!e.url;if(e.url)link.href=e.url;else link.removeAttribute('href');
 drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');document.getElementById('drawerScroll').scrollTop=0;
 requestAnimationFrame(()=>{fitEventGallery();declutterLabels();});
}

// Fit every event photograph into the same 3:2 frame without stretching or cropping.
function eventGallerySize(width,height,stacked=false){const w=Math.max(0,Math.min(width,stacked?width:Math.max(0,height)*1.5));return [w,w/1.5];}
function fitEventGallery(){
 const gallery=document.getElementById('detailGallery');if(gallery.hidden)return;
 const media=gallery.parentElement;const [w,h]=eventGallerySize(media.clientWidth,media.clientHeight,matchMedia('(max-width:760px)').matches);
 gallery.style.width=w+'px';gallery.style.height=h+'px';
}
new ResizeObserver(()=>requestAnimationFrame(fitEventGallery)).observe(document.querySelector('.event-viewer__media'));
document.getElementById('detailGallery').addEventListener('keydown',event=>{
 if(!activeEvent?.photos.length||!['ArrowLeft','ArrowRight'].includes(event.key))return;
 event.preventDefault();event.stopPropagation();setGallery(activeEvent,(galleryIndex+(event.key==='ArrowRight'?1:-1)+activeEvent.photos.length)%activeEvent.photos.length);
});

function closeDetails(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');activeEvent=null;document.querySelectorAll('.station.selected').forEach(n=>n.classList.remove('selected'));requestAnimationFrame(declutterLabels)}
document.getElementById('detailClose').addEventListener('click',closeDetails);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetails();document.getElementById('eventSearch').blur()}});
document.getElementById('galleryPrev').addEventListener('click',()=>activeEvent&&setGallery(activeEvent,(galleryIndex-1+activeEvent.photos.length)%activeEvent.photos.length));
document.getElementById('galleryNext').addEventListener('click',()=>activeEvent&&setGallery(activeEvent,(galleryIndex+1)%activeEvent.photos.length));
document.getElementById('allRoutes').addEventListener('click',()=>{document.getElementById('eventSearch').value='';searchQuery='';setRouteFocus(null)});
document.getElementById('eventSearch').addEventListener('input',e=>{searchQuery=e.target.value.trim().toLocaleLowerCase();updateFilters()});
function navigateLine(delta){const next=activeRoute===null?(delta>0?0:routeDefs.length-1):(routeDefs.findIndex(r=>r.id===activeRoute)+delta+routeDefs.length)%routeDefs.length;setRouteFocus(routeDefs[next].id)}
document.getElementById('prevLine').addEventListener('click',()=>navigateLine(-1));
document.getElementById('nextLine').addEventListener('click',()=>navigateLine(1));
function applyView(){mapWorld.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${scale})`;hideTip();requestAnimationFrame(declutterLabels)}
function fitMap(){const w=mapViewport.clientWidth,h=mapViewport.clientHeight;scale=Math.min((w-32)/worldW,(h-25)/worldH);scale=Math.max(.27,Math.min(1.5,scale));offsetX=(w-worldW*scale)/2;offsetY=(h-worldH*scale)/2;applyView()}
function zoomToRoute(id){const ps=routeById[id].pts;const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]*scaleY);
 const minX=Math.min(...xs)-100,maxX=Math.max(...xs)+100,minY=Math.min(...ys)-85,maxY=Math.max(...ys)+85;
 const w=mapViewport.clientWidth,h=mapViewport.clientHeight;
 // Do not crop an entire route just to magnify the focus state.
 scale=Math.min((w-40)/(maxX-minX),(h-35)/(maxY-minY),1.25);
 scale=Math.max(.4,scale);offsetX=(w-(minX+maxX)*scale)/2;offsetY=(h-(minY+maxY)*scale)/2;applyView()
}
function zoomAt(factor,clientX,clientY){const rect=mapViewport.getBoundingClientRect();const px=clientX-rect.left,py=clientY-rect.top;const beforeX=(px-offsetX)/scale,beforeY=(py-offsetY)/scale;
 scale=Math.max(.32,Math.min(2.4,scale*factor));offsetX=px-beforeX*scale;offsetY=py-beforeY*scale;applyView()}
document.getElementById('fitMap').addEventListener('click',()=>activeRoute?zoomToRoute(activeRoute):fitMap());
document.getElementById('zoomIn').addEventListener('click',()=>{const r=mapViewport.getBoundingClientRect();zoomAt(1.22,r.left+r.width/2,r.top+r.height/2)});
document.getElementById('zoomOut').addEventListener('click',()=>{const r=mapViewport.getBoundingClientRect();zoomAt(1/1.22,r.left+r.width/2,r.top+r.height/2)});
mapViewport.addEventListener('wheel',e=>{if(e.target.closest('.detail-drawer'))return;e.preventDefault();zoomAt(e.deltaY<0?1.13:1/1.13,e.clientX,e.clientY)},{passive:false});
mapViewport.addEventListener('pointerdown',e=>{if(e.target.closest('.station,.detail-drawer'))return;if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY,id:e.pointerId};moved=false;mapViewport.setPointerCapture(e.pointerId);mapViewport.classList.add('grabbing')});
mapViewport.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;offsetX=drag.ox+dx;offsetY=drag.oy+dy;applyView()});
mapViewport.addEventListener('pointerup',e=>{drag=null;mapViewport.classList.remove('grabbing');setTimeout(()=>moved=false,0)});
mapViewport.addEventListener('pointercancel',()=>{drag=null;mapViewport.classList.remove('grabbing')});
function intersects(a,b,pad){return a.left<b.right+pad&&a.right>b.left-pad&&a.top<b.bottom+pad&&a.bottom>b.top-pad}
// One global label, weighted towards highlights, changes every two active seconds.
let spotlightId=null,spotlightTimer=0,spotlightManual=false,spotlightHostActive=parent===window;
const spotlightReduce=matchMedia('(prefers-reduced-motion:reduce)');
function spotlightEligible(){
 const vp=mapViewport.getBoundingClientRect();
 return [...document.querySelectorAll('.station:not(.dim)')].filter(node=>{const r=node.getBoundingClientRect();return r.width>0&&r.left>=vp.left+4&&r.right<=vp.right-4&&r.top>=vp.top+4&&r.bottom<=vp.bottom-4;});
}
function pickSpotlight(pool,previous=spotlightId){
 let candidates=pool.filter(n=>n.dataset.id!==previous);if(!candidates.length)candidates=pool;
 const total=candidates.reduce((sum,n)=>sum+(n.classList.contains('featured')?5:1),0);let draw=Math.random()*total;
 return candidates.find(n=>(draw-=n.classList.contains('featured')?5:1)<0)||candidates.at(-1);
}
function spotlightAllowed(){return spotlightHostActive&&!document.hidden&&!activeEvent&&!spotlightManual;}
function scheduleSpotlight(delay=2000){clearTimeout(spotlightTimer);spotlightTimer=0;if(spotlightAllowed()&&!spotlightReduce.matches)spotlightTimer=setTimeout(rotateSpotlight,delay);}
function rotateSpotlight(){
 clearTimeout(spotlightTimer);spotlightTimer=0;if(!spotlightAllowed()){if(!spotlightManual)tip.classList.remove('show');return;}
 const node=pickSpotlight(spotlightEligible());if(!node){tip.classList.remove('show');return;}
 spotlightId=node.dataset.id;const event=events.find(e=>e.id===spotlightId);paintTip(node,event);tip.dataset.eventId=spotlightId;tip.dataset.mode='automatic';scheduleSpotlight();
}
function showTip(node,event){clearTimeout(spotlightTimer);spotlightTimer=0;spotlightManual=true;spotlightId=event.id;paintTip(node,event);tip.dataset.eventId=event.id;tip.dataset.mode='manual';}
function hideTip(){spotlightManual=false;tip.classList.remove('show');scheduleSpotlight(0);}
function declutterLabels(){
 if(activeEvent){clearTimeout(spotlightTimer);spotlightTimer=0;tip.classList.remove('show');return;}
 const pool=spotlightEligible(),current=pool.find(n=>n.dataset.id===spotlightId);
 if(spotlightManual&&current){paintTip(current,events.find(e=>e.id===spotlightId));return;}
 if(!spotlightAllowed())return;
 if(current){paintTip(current,events.find(e=>e.id===spotlightId));if(!spotlightTimer)scheduleSpotlight();}
 else rotateSpotlight();
}
addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='gcc-events:activate')return;spotlightHostActive=event.data.active!==false;clearTimeout(spotlightTimer);spotlightTimer=0;spotlightManual=false;if(spotlightHostActive)rotateSpotlight();else tip.classList.remove('show');});
document.addEventListener('visibilitychange',()=>{clearTimeout(spotlightTimer);spotlightTimer=0;if(document.hidden)tip.classList.remove('show');else rotateSpotlight();});
spotlightReduce.addEventListener('change',()=>{clearTimeout(spotlightTimer);spotlightTimer=0;rotateSpotlight();});

window.addEventListener('resize',()=>activeRoute?zoomToRoute(activeRoute):fitMap());
updateFilters();requestAnimationFrame(()=>{fitMap();setTimeout(declutterLabels,350)});
</script>
