<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>GBS Yearbook · Annual Report 2025/26 · Interactive prototype</title>
<style>
:root{--blue:#003366;--pale:#ccd7e6;--accent:#00a6e3;--ink:#1d2934;--paper:#f8f6ef;--paper2:#f5f0e5;--dark:#0c1f35;--frame:#eaebdf;--red:#c34343;--yellow:#ffde5b;--flipTime:900ms}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Source Sans 3",Arial,sans-serif;background:#6f4934;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.backdrop{position:fixed;inset:-16px;background:#805438;z-index:-2;overflow:hidden}
.backdrop:before{content:"";position:absolute;inset:-18px;background-image:var(--wood);background-position:center center;background-size:cover;filter:blur(8px) saturate(.78) brightness(.82);transform:scale(1.04)}
.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(33,22,15,.19),rgba(48,30,17,.1) 48%,rgba(29,18,12,.25))}
.backdrop-water{display:none}
.topbar{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;min-height:72px;padding:16px clamp(22px,5vw,85px);gap:18px}
.brandline{display:flex;gap:14px;align-items:center}
.brand-rule{width:5px;height:34px;background:var(--accent);border-radius:3px}
.brandline strong{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.brandline span{display:block;font-size:10px;letter-spacing:.11em;opacity:.74;text-transform:uppercase;margin-top:3px}
.topnote{font-size:11px;letter-spacing:.11em;font-weight:700;text-align:right;opacity:.8;text-transform:uppercase}
.main{height:calc(100svh - 145px);min-height:440px;display:flex;align-items:center;justify-content:center;padding:0 24px}
.book-space{position:relative;width:min(1190px,calc(100vw - 95px));height:min(685px,calc(100svh - 165px));min-height:400px;perspective:2400px;transform:translateZ(0)}
.book-space:before{content:"";position:absolute;inset:-11px -10px -12px;border-radius:13px;background:#152b46;box-shadow:0 44px 66px rgba(0,0,0,.45),0 10px 16px rgba(0,0,0,.26);z-index:0}
.book-space:after{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:17px;transform:translateX(-50%);z-index:5;pointer-events:none;background:linear-gradient(90deg,rgba(4,21,38,.28),rgba(255,255,255,.22) 46%,rgba(2,15,29,.27));mix-blend-mode:multiply}
.book-page{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;padding:30px clamp(28px,3vw,49px) 23px;background:var(--paper);color:var(--ink)}
.book-page:after{content:"";position:absolute;inset:0;z-index:-1;opacity:.38;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(0,51,102,.022) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(0,51,102,.012) 0 1px,transparent 1px 7px)}
.book-page.left-page{border-radius:5px 0 0 5px;box-shadow:inset -12px 0 22px -18px rgba(0,0,0,.62)}
.book-page.right-page{border-radius:0 5px 5px 0;box-shadow:inset 12px 0 22px -18px rgba(0,0,0,.68)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-shrink:0;min-height:33px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-weight:800;border-bottom:1px solid #ccd4d7}
.head-mark{font-weight:700;font-size:9px;letter-spacing:.13em;color:#6e7b82}
.chapter-line{display:flex;gap:9px;align-items:center;color:var(--blue);font-size:10px;letter-spacing:.16em;font-weight:800;margin:23px 0 0;text-transform:uppercase}
.chapter-dot{width:8px;height:8px;background:var(--accent);transform:rotate(45deg)}
.page-content{display:flex;flex:1;flex-direction:column;justify-content:center;min-height:0}
.page-title{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(32px,3.6vw,59px);line-height:.98;letter-spacing:-.055em;font-weight:600;color:var(--blue);margin:4px 0 17px}
.line-break{display:block}
.page-subtitle{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:clamp(14px,1.4vw,19px);line-height:1.26;color:#5b6c78;margin-bottom:18px}
.page-copy{font-size:clamp(12px,1.06vw,15px);line-height:1.57;max-width:410px;color:#283743}
.page-copy p{margin:0 0 12px}
.page-copy p:last-child{margin-bottom:0}
.archive-stat{display:flex;align-items:center;gap:13px;margin-top:23px;border-top:1px solid #d3d9d8;padding-top:17px;color:var(--blue)}
.archive-stat strong{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(25px,2.3vw,39px);font-weight:700;line-height:1;color:var(--blue)}
.archive-stat span{font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;max-width:170px;line-height:1.3}
.page-foot{flex-shrink:0;border-top:1px solid #ccd4d7;padding-top:12px;min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:9px;letter-spacing:.1em;font-weight:700;color:#70808b;text-transform:uppercase}
.page-num{font-family:"Source Serif 4",Georgia,serif;color:var(--blue);font-size:22px;font-weight:600;line-height:1}
.cover-page{background:var(--blue);color:#fff}
.cover-page .page-title,.cover-page .cover-year{color:#fff}
.cover-page .page-head,.cover-page .chapter-line{color:#fff}
.cover-page .head-mark,.cover-page .page-foot{color:#b8cfdf}
.cover-page .page-head,.cover-page .page-foot{border-color:rgba(255,255,255,.3)}
.cover-page .page-num{color:#fff}
.cover-page .page-subtitle{color:#ccd7e6}
.cover-page .page-copy{color:#e8eff6}
.cover-page .chapter-line{margin-top:38px}
.cover-page .page-content{justify-content:center}
.cover-page .page-title{margin-top:5px;font-weight:500;line-height:1.02}
.cover-small{display:block;font-family:"Source Sans 3",Arial,sans-serif;font-size:11px;letter-spacing:.14em;font-weight:800;margin-bottom:16px}
.cover-big{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:clamp(39px,4.9vw,80px);line-height:.93;letter-spacing:-.07em}
.cover-year{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:clamp(41px,5.5vw,87px);letter-spacing:-.07em;font-weight:600;margin-top:6px;color:var(--blue)}
.cover-year .dash{color:var(--accent);padding:0 .06em}
.photo-page{padding:30px clamp(25px,3vw,42px) 23px;background:#f6f1e8}
.photo-block{display:flex;flex:1;flex-direction:column;min-height:0;justify-content:center;position:relative}
.photo-mat{background:#fff;box-shadow:0 11px 26px rgba(16,40,60,.11);padding:15px 15px 18px;transform:rotate(-1.1deg);border:1px solid #e4e0d7;max-width:100%;position:relative}
.photo-mat:before{content:"";position:absolute;left:47%;top:-8px;width:76px;height:17px;background:rgba(204,215,230,.73);transform:rotate(1deg);z-index:3;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.photo-frame{height:min(37vh,345px);min-height:188px;overflow:hidden;background:#e7edf0;position:relative}
.photo-frame>img,.photo-link>img{height:100%;width:100%;object-fit:cover;transition:transform .65s ease}
.photo-frame:hover img{transform:scale(1.035)}
.photo-frame.contain{background:var(--blue);display:grid;place-items:center}
.photo-link{display:block;width:100%;height:100%;position:relative;color:#fff}
.photo-link img{object-fit:contain}
.play-disc{position:absolute;left:50%;top:50%;width:68px;height:68px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);box-shadow:0 8px 25px rgba(0,0,0,.2);color:var(--blue);display:grid;place-items:center;padding-left:5px;font-size:21px}
.photo-caption{padding:12px 4px 0;font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:clamp(11px,1.15vw,14px);color:#415663}
.stamp{font-size:9px;letter-spacing:.14em;line-height:1.7;font-weight:800;align-self:flex-end;margin:15px 2px 0;color:#7790a0;transform:rotate(-8deg);border:2px solid rgba(0,51,102,.27);padding:6px 10px;text-align:center}
.logo-card{margin:16px auto 0;width:min(155px,40%);padding:5px 15px;background:white;box-shadow:0 3px 16px rgba(0,0,0,.05);transform:rotate(3deg)}
.logo-card img{width:100%;height:auto}
.watch-line{text-align:center;color:var(--blue);letter-spacing:.12em;font-size:10px;font-weight:800;margin-top:21px}
.watch-line span{font-size:17px}
.watch-line a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px}.watch-line a:hover{text-decoration:underline;text-underline-offset:3px}

.outlook-numbers{margin:19px 0 0;display:flex;justify-content:space-around;gap:8px;color:var(--blue);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.outlook-numbers span{display:flex;flex-direction:column;align-items:center;gap:2px}
.outlook-numbers b{font-family:"Source Serif 4",Georgia,serif;font-size:27px;font-weight:700}
/* underlying pages */
.static-page{position:absolute;top:0;height:100%;width:50%;z-index:1}
.static-page.left{left:0}.static-page.right{right:0}
.flip-sheet{position:absolute;top:0;width:50%;height:100%;z-index:8;transform-style:preserve-3d;transition:transform var(--flipTime) cubic-bezier(.45,0,.25,1);will-change:transform;pointer-events:none}
.flip-sheet.forward{left:50%;transform-origin:left center;transform:rotateY(0deg)}
.flip-sheet.forward.turn{transform:rotateY(-180deg)}
.flip-sheet.reverse{left:0;transform-origin:right center;transform:rotateY(0deg)}
.flip-sheet.reverse.turn{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper);box-shadow:0 0 30px rgba(0,0,0,.08)}
.flip-face.front{transform:translateZ(0.4px)}.flip-face.back{transform:rotateY(180deg) translateZ(0.6px)}
.flip-face .book-page{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-sheet .flip-face.front:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.09) 97%,rgba(0,0,0,.15) 100%);pointer-events:none}
.flip-sheet .flip-face.back:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.15),transparent 18%);pointer-events:none}
/* Shadows on the page faces are GPU-friendly and remain unchanged. */
.controls{position:relative;z-index:20;display:flex;align-items:center;justify-content:center;gap:24px;padding:15px 22px 15px;min-height:73px}
.nav-btn{display:flex;gap:10px;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.46);color:#fff;padding:10px 15px;background:rgba(0,51,102,.54);border-radius:6px;font-size:12px;letter-spacing:.07em;font-weight:800;text-transform:uppercase;min-width:154px;transition:background .2s ease, transform .2s ease}
.nav-btn:hover:not(:disabled){background:var(--blue);transform:translateY(-2px)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn .arrow{font-size:20px;line-height:.6;font-weight:400}
.book-counter{display:flex;flex-direction:column;gap:1px;align-items:center;min-width:220px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.book-counter strong{font-family:"Source Serif 4",Georgia,serif;font-size:17px;letter-spacing:0;font-weight:500;text-transform:none;line-height:1.3;white-space:nowrap}
.progress-track{height:3px;background:rgba(255,255,255,.3);width:175px;margin-top:7px;border-radius:5px;overflow:hidden}
.progress-bar{height:100%;width:0;background:var(--accent);transition:width .4s ease}
.corner-hit{position:absolute;z-index:3;top:0;right:0;height:100%;width:37px;border:0;background:none;color:transparent;cursor:pointer}
.corner-hit.left-hit{right:auto;left:0}
.book-space.flipping .corner-hit{pointer-events:none}
@media(max-height:790px){.topbar{min-height:58px;padding-top:12px;padding-bottom:10px}.main{height:calc(100svh - 120px)}.book-space{height:min(620px,calc(100svh - 145px))}.book-page{padding-top:21px;padding-bottom:16px}.chapter-line{margin-top:15px}.page-title{margin-bottom:12px}.page-subtitle{margin-bottom:13px}.archive-stat{margin-top:14px;padding-top:12px}.photo-frame{height:min(35vh,280px)}.controls{min-height:62px}}
@media(max-width:1050px){.book-space{width:calc(100vw - 52px);height:min(620px,calc(100svh - 170px))}.book-page{padding-left:25px;padding-right:25px}.page-title{font-size:clamp(29px,4.25vw,45px)}.page-copy{font-size:12px}.cover-big{font-size:clamp(36px,6vw,62px)}.cover-year{font-size:clamp(43px,6vw,68px)}.photo-page{padding-left:20px;padding-right:20px}.photo-frame{min-height:175px}.topnote{display:none}}
@media(max-width:650px){body{overflow:auto}.topbar{min-height:58px;padding:10px 18px}.main{height:auto;min-height:calc(100svh - 125px);padding:14px 9px;align-items:center}.book-space{width:calc(100vw - 22px);height:min(75vh,550px);min-height:420px}.book-page{padding:20px 13px 14px}.page-head{font-size:7px}.head-mark{font-size:7px}.chapter-line{font-size:8px;margin-top:18px}.page-title{font-size:clamp(24px,5.2vw,37px)}.page-copy{font-size:10px;line-height:1.47}.page-copy p{margin-bottom:7px}.page-subtitle{font-size:12px}.archive-stat{gap:6px;padding-top:10px;margin-top:10px}.archive-stat strong{font-size:22px}.archive-stat span{font-size:8px}.photo-page{padding:20px 11px 14px}.photo-mat{padding:7px 7px 12px}.photo-frame{height:23vh;min-height:115px}.photo-caption{font-size:10px}.stamp{font-size:7px}.logo-card{margin-top:9px}.cover-small{font-size:8px}.cover-big{font-size:clamp(23px,5.2vw,37px)}.cover-year{font-size:clamp(26px,5.9vw,45px)}.page-foot{font-size:7px}.page-num{font-size:17px}.controls{gap:8px;flex-wrap:wrap;padding:5px 6px 18px}.nav-btn{min-width:105px;font-size:9px;padding:10px 7px}.book-counter{min-width:120px;font-size:8px}.book-counter strong{font-size:12px;max-width:145px;overflow:hidden;text-overflow:ellipsis}.progress-track{width:110px}.outlook-numbers{font-size:7px}.outlook-numbers b{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Keep the full, official pathway names clear and readable. */
.programme-title{font-size:clamp(28px,3vw,46px);line-height:1.06;letter-spacing:-.035em}

/* AHK-aligned training partner index, in keeping with the yearbook aesthetic. */
.archive-stat{flex-wrap:wrap;row-gap:9px}
.company-button{margin-left:auto;border:1px solid #003366;background:#003366;color:#fff;padding:10px 13px;border-radius:2px;font-family:"Source Sans 3",Arial,sans-serif;font-size:10px;font-weight:800;letter-spacing:.045em;line-height:1.25;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
.company-button:hover{background:#00508d;transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,51,102,.2)}
.company-button:focus-visible{outline:3px solid #00A6E3;outline-offset:3px}
.company-button span{font-size:14px;margin-left:4px}
.training-companies-dialog{color:#193147;background:#f9f6ee;border:2px solid #003366;border-radius:4px;box-shadow:0 26px 85px rgba(0,15,36,.43);width:min(760px,calc(100vw - 32px));max-height:min(82vh,760px);padding:0;overflow:auto}
.training-companies-dialog::backdrop{background:rgba(0,22,50,.67);backdrop-filter:blur(5px)}
.training-companies-header{background:#003366;color:#fff;padding:22px 30px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.training-companies-header small{display:block;color:#ccd7e6;font-size:10px;letter-spacing:.14em;font-weight:800}
.training-companies-header h2{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(24px,3vw,39px);font-weight:600;line-height:1.05;margin:7px 0 0}
.company-close{flex-shrink:0;display:grid;place-items:center;background:transparent;border:1px solid #ccd7e6;border-radius:50%;height:36px;width:36px;color:#fff;font-size:24px;cursor:pointer}
.company-close:hover{background:rgba(255,255,255,.14)}
.training-companies-inner{padding:23px 30px 29px}
.company-intro{font-size:13px;line-height:1.5;margin:0 0 18px;color:#43505b}
.company-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 20px;list-style:none;padding:0;margin:0}
.company-grid li{position:relative;background:#fff;border-left:3px solid #00A6E3;padding:9px 11px;font-size:12px;line-height:1.3;box-shadow:0 2px 8px rgba(0,51,102,.035)}
.company-note{font-size:11px;line-height:1.45;color:#677685;border-top:1px solid #d5dcd9;margin:20px 0 0;padding-top:12px}

/* Training-company logo walls for the three pathways */
.archive-stat.archive-logo-wall{display:block;margin-top:12px;padding-top:10px;border-top:1px solid #d5dcd9}
.archive-stat.archive-logo-wall>strong,.archive-stat.archive-logo-wall>span{display:none}
.programme-logo-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 6px}
.programme-logo-kicker{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#003366;line-height:1.2}
.programme-logo-count{font-size:11px;line-height:1.25;color:#6d7985;text-align:right}
.programme-logo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.programme-logo-card{background:#fff;border:1px solid #d5dcd9;border-radius:4px;min-height:58px;padding:5px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 10px rgba(0,51,102,.05)}
.programme-logo-card img{max-width:100%;max-height:30px;object-fit:contain;display:block}
.programme-logo-card.logo-card-dark{background:#0b3255}
.programme-logo-card .logo-fallback{display:flex;align-items:center;justify-content:center;min-height:30px;font-size:10px;font-weight:800;line-height:1.15;text-align:center;color:#193147}
.programme-logo-card .logo-company-name{font-size:8px;line-height:1.15;text-align:center;color:#5b6975}
.programme-logo-card.logo-more-card{justify-content:center;background:#edf4fb;border-style:dashed}
.programme-logo-card.logo-more-card .logo-fallback{color:#003366;font-size:11px}

.programme-logo-footer .company-button{margin-left:0;padding:7px 10px;white-space:nowrap}

@media(max-width:650px){.programme-logo-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.programme-logo-card{min-height:66px;padding:7px 5px}.programme-logo-card img{max-height:26px}.programme-logo-kicker{font-size:9px}.programme-logo-count,.programme-logo-footer-note{font-size:10px}.company-grid.company-logo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

@media(max-width:650px){.archive-stat{margin-top:11px;padding-top:9px}.company-button{font-size:8px;padding:7px 9px}.training-companies-header{padding:18px 20px}.training-companies-inner{padding:18px 20px}.company-grid{grid-template-columns:1fr}}



/* Hong Kong details: collectible tram-ticket markers and a moving ding ding on the chapter line. */
.chapter-track{overflow:visible}
.track-tram{position:absolute;left:0;top:-3px;z-index:2;width:44px;height:24px;pointer-events:none;transform:translateX(0);transition:transform .78s cubic-bezier(.33,.08,.19,1);filter:drop-shadow(0 3px 5px rgba(0,0,0,.24));animation:tramBob 2.6s ease-in-out infinite}
.track-tram .tram-pole{position:absolute;left:21px;top:0;width:2px;height:8px;background:#f2efe5;border-radius:2px;transform:skewX(-12deg)}
.track-tram .tram-pole:after{content:"";position:absolute;left:-5px;top:-1px;width:12px;height:2px;background:#f2efe5;border-radius:2px;transform:rotate(-28deg)}
.track-tram .tram-body{position:absolute;left:2px;top:7px;width:40px;height:14px;border-radius:5px;background:linear-gradient(180deg,#f2e8c1 0 4px,#2a8a6e 4px 100%);border:1px solid rgba(8,44,35,.4)}
.track-tram .tram-body:before{content:"";position:absolute;left:5px;top:5px;width:30px;height:4px;border-radius:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.88) 0 5px,rgba(255,255,255,.15) 5px 7px)}
.track-tram .tram-wheel{position:absolute;bottom:1px;width:6px;height:6px;border-radius:50%;background:#1e2630;border:1px solid rgba(255,255,255,.18)}
.track-tram .tram-wheel.left{left:10px}.track-tram .tram-wheel.right{right:10px}
.track-tram .tram-bell{position:absolute;left:4px;top:10px;font-size:8px;line-height:1;color:#f9f1cf;font-weight:800}

// Performance-only: convert each embedded image once into a local blob URL.
// This is fully self-contained/offline, retains the original pixels and
// avoids repeatedly parsing megabytes of base64 during a page turn.
(function compactEmbeddedImages(){
  const known = new Map();
  const pattern = /data:image\/(jpeg|png|webp);base64,([A-Za-z0-9+/=]+)/g;
  function assetUrl(original, mime, b64) {
    if (known.has(original)) return known.get(original);
    const binary = atob(b64);
    const pixels = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; ++i) pixels[i] = binary.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([pixels], {type:'image/'+mime}));
    known.set(original,url);
    return url;
  }
  for (const spread of spreads) {
    spread.left = spread.left.replace(pattern,assetUrl);
    spread.right = spread.right.replace(pattern,assetUrl);
  }
})();

// Hold only the current/adjacent illustrations decoded in browser memory.
// They are prepared outside the animation, so turning a page stays responsive.
const warmImages = new Map();
function prewarmNearbyImages(pageIndex){
  const needed = new Set();
  for (let n=Math.max(0,pageIndex-1); n<=Math.min(spreads.length-1,pageIndex+1); ++n) {
    for (const side of ['left','right']) {
      for (const [,url] of spreads[n][side].matchAll(/<img\b[^>]*\bsrc=["'](blob:[^"']+)["']/g)) needed.add(url);
    }
  }
  for (const [url] of warmImages) if (!needed.has(url)) warmImages.delete(url);
  for (const url of needed) {
    if (warmImages.has(url)) continue;
    const img = new Image();
    img.decoding='async';
    img.src=url;
    warmImages.set(url,img);
    if (img.decode) img.decode().catch(()=>{});
  }
}

function createCompanyCard(name){
  const card=document.createElement('div');
  card.className='programme-logo-card';
  const img=document.createElement('img');
  img.src=companyLogos[name];
  img.alt=name+' logo';
  img.loading='eager';
  img.decoding='async';
  card.appendChild(img);
  return card;
}
function enhancePathwayPages(){
  // Keep the complete training-company logo walls in the existing dialog,
  // but show only their opening button on the three training pathway pages.
  document.querySelectorAll('.company-button[data-pathway]').forEach(button=>{
    const archive=button.closest('.archive-stat');
    if(!archive||archive.dataset.logoWallReady==='true')return;
    archive.dataset.logoWallReady='true';
    archive.classList.remove('archive-logo-wall');
    button.innerHTML='Training Companies <span aria-hidden="true">↗</span>';
    archive.replaceChildren(button);
  });
}
function openCompanies(pathway){
  const names=companyLists[pathway];
  if(!Array.isArray(names)||turning)return;
  companyDialogTitle.textContent=companyNames[pathway];
  companyDialogList.className='company-grid company-logo-grid';
  companyDialogList.replaceChildren(...names.map(name=>{
    const item=document.createElement('li');
    item.appendChild(createCompanyCard(name,false));
    return item;
  }));
  companyDialog.showModal();
}
document.addEventListener('click',event=>{
  const button=event.target.closest?.('[data-pathway]');
  if(button){event.preventDefault();openCompanies(button.dataset.pathway);}
});
document.getElementById('closeCompanyDialog').addEventListener('click',()=>companyDialog.close());

const leftEl=document.getElementById('staticLeft');
const rightEl=document.getElementById('staticRight');
const flipLayer=document.getElementById('flipLayer');
const book=document.getElementById('book');
const previous=document.getElementById('leftHit');
const next=document.getElementById('rightHit');
const counter={set textContent(value){book.dataset.spread=value;}};
const chapterLabel={set textContent(value){book.setAttribute('aria-label','German Business School yearbook: '+value);}};
const chapterDots=null;
const chapterTrackFill={style:{}};
const trackTram=null;
const backToStart={disabled:false,addEventListener(){}};
const chapterButtons=[];
let index=0, turning=false, wheelLock=false;
function updateTrackTram(idx){
  if(!trackTram||!chapterButtons[idx])return;
  const stop=chapterButtons[idx];
  const ring=stop.querySelector('.stop-ring')||stop;
  const center=stop.offsetLeft + ring.offsetLeft + ring.offsetWidth/2;
  const x=center-trackTram.offsetWidth/2;
  trackTram.style.transform=`translateX(${x}px)`;
}
function renderStatic(idx){
  leftEl.innerHTML=spreads[idx].left;
  rightEl.innerHTML=spreads[idx].right;
  index=idx;
  counter.textContent=`${String(idx+1).padStart(2,'0')} / ${String(spreads.length).padStart(2,'0')}`;
  chapterLabel.textContent=spreads[idx].name;
  chapterTrackFill.style.transform=`scaleX(${spreads.length>1?idx/(spreads.length-1):0})`;
  chapterButtons.forEach((button,i)=>{
    button.classList.toggle('active',i===idx);
    button.classList.toggle('visited',i<idx);
    if(i===idx)button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  if(window.innerWidth<=650){
    const windowEl=document.querySelector('.chapter-track-window');
    const activeDot=chapterButtons[idx];
    if(windowEl&&activeDot){
      const desired=activeDot.offsetLeft+activeDot.offsetWidth/2-windowEl.clientWidth/2;
      windowEl.scrollTo({left:Math.max(0,desired),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    }
  }
  backToStart.disabled=idx===0;
  previous.disabled=idx===0;
  next.disabled=false;next.setAttribute('aria-label',idx===spreads.length-1?'Return to first double-spread':'Next double-spread');
  animatePageNumbers();
  prewarmNearbyImages(idx);
  enhancePathwayPages();
  requestAnimationFrame(()=>updateTrackTram(idx));
}
function buildChapterNavigation(){
  spreads.forEach((spread,i)=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='chapter-stop';
    button.title=`Page ${String(i+1).padStart(2,'0')} · ${spread.name}`;
    button.setAttribute('aria-label',`Jump to page ${i+1} of ${spreads.length}: ${spread.name}`);
    const ring=document.createElement('span');
    ring.className='stop-ring';
    ring.setAttribute('aria-hidden','true');
    const page=document.createElement('span');
    page.className='stop-page';
    page.textContent=String(i+1).padStart(2,'0');
    button.append(ring,page);
    button.addEventListener('click',()=>{updateTrackTram(i);turnTo(i)});
    chapterDots.appendChild(button);
    chapterButtons.push(button);
  });
}
let renderToken=0;
function animatePageNumbers(){
  const token=++renderToken;
  const items=index===spreads.length-1 ? [...rightEl.querySelectorAll('.outlook-numbers b')] : [];
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach((el,sequence)=>{
    const original=el.textContent.trim();
    if(!/^\d[\d,]*$/.test(original))return;
    const target=Number(original.replaceAll(',',''));
    if(!Number.isSafeInteger(target)||reduced)return;
    const formatter=new Intl.NumberFormat('en-GB');
    const delay=120+sequence*115;
    const duration=target>=1000?1350:1050;
    el.textContent='0';
    let start;
    function frame(now){
      if(token!==renderToken||!el.isConnected)return;
      if(start===undefined)start=now+delay;
      const t=Math.min(1,Math.max(0,(now-start)/duration));
      const ease=1-Math.pow(1-t,3);
      el.textContent=formatter.format(Math.round(ease*target));
      if(t<1)requestAnimationFrame(frame);
      else el.classList.add('number-done');
    }
    requestAnimationFrame(frame);
  });
}
function flip(dir){const target=dir>0&&index===spreads.length-1?0:index+dir;turnTo(target);}
function turnTo(target){
 if(window.yearbookIsReady===false)return;
 if(turning||companyDialog.open) return;
 if(!Number.isInteger(target)||target===index||target<0||target>=spreads.length)return;
 const dir=target>index?1:-1;
 turning=true;book.classList.add('flipping');previous.disabled=true;next.disabled=true;
 const current=spreads[index], nextData=spreads[target];
 const forward=dir>0;
 // The moving leaf carries the old right page on its front and
 // the next left page on the reverse: a real book-like page turn.
 if(forward){leftEl.innerHTML=current.left;rightEl.innerHTML=nextData.right;}
 else {leftEl.innerHTML=nextData.left;rightEl.innerHTML=current.right;}
 const sheet=document.createElement('div');
 sheet.className=`flip-sheet ${forward?'forward':'reverse'}`;
 sheet.innerHTML=`<div class="flip-face front">${forward?current.right:current.left}</div><div class="flip-face back">${forward?nextData.left:nextData.right}</div>`;
 flipLayer.appendChild(sheet);
 enhancePathwayPages();
 let finished=false;
 function complete(){
   if(finished)return;finished=true;sheet.remove();renderStatic(target);turning=false;book.classList.remove('flipping');
 }
 sheet.addEventListener('transitionend',e=>{if(e.target===sheet && e.propertyName==='transform')complete()},{once:true});
 requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add('turn')));
 setTimeout(complete,1250);
}

document.addEventListener('click',event=>{
  const button=event.target.closest?.('[data-play-instagram]');
  if(!button||turning)return;
  const box=button.closest('.instagram-frame');
  const frame=box?.querySelector('iframe[data-embed-url]');
  if(!frame)return;
  frame.hidden=false;
  frame.src=frame.dataset.embedUrl;
  box.querySelector('.instagram-cover')?.remove();
});


// The Contents page uses the same smooth book turn as the existing navigation.
document.addEventListener('click',event=>{
  const entry=event.target.closest?.('[data-toc-spread]');
  if(!entry)return;
  event.preventDefault();
  const target=Number(entry.dataset.tocSpread);
  if(turning||companyDialog.open||!Number.isInteger(target))return;
  updateTrackTram(target);
  turnTo(target);
});
backToStart.addEventListener('click',()=>{updateTrackTram(0);turnTo(0)});


document.getElementById('rightHit').addEventListener('click',()=>flip(1));
document.getElementById('leftHit').addEventListener('click',()=>flip(-1));
document.addEventListener('keydown',e=>{if(companyDialog.open)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();flip(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();flip(-1)}});
let sx=null;
book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
book.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>55)flip(dx<0?1:-1);sx=null},{passive:true});
window.addEventListener('wheel',e=>{
 if(companyDialog.open)return;
 if(e.ctrlKey||Math.abs(e.deltaY)<18) return;
 if(window.innerWidth<=650)return;
 e.preventDefault();
 if(turning||wheelLock) return;
 wheelLock=true;flip(e.deltaY>0?1:-1);
 setTimeout(()=>wheelLock=false,950);
},{passive:false});
window.addEventListener('resize',()=>updateTrackTram(index));

renderStatic(0);
requestAnimationFrame(()=>updateTrackTram(0));
</script>
<script>(()=>{'use strict';
 const reduced=matchMedia('(prefers-reduced-motion:reduce)');let active=false,openTimer=0,finishTimer=0;
 window.yearbookIsReady=false;
 function reset(){clearTimeout(openTimer);clearTimeout(finishTimer);window.yearbookIsReady=false;document.body.classList.remove('book-opening','book-open','book-closed');}
 function activate(value){if(active===value)return;active=value;reset();if(!value)return;renderStatic(0);document.body.classList.add('book-closed');
  if(reduced.matches){document.body.classList.replace('book-closed','book-open');window.yearbookIsReady=true;return;}
  openTimer=setTimeout(()=>{document.body.classList.replace('book-closed','book-opening');finishTimer=setTimeout(()=>{document.body.classList.replace('book-opening','book-open');window.yearbookIsReady=true;},1800);},2000);
 }
 addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='yearbook:active')activate(!!event.data.active);});
 document.addEventListener('visibilitychange',()=>document.body.classList.toggle('yearbook-hidden',document.hidden));
 parent.postMessage({type:'yearbook:ready'},'*');if(parent===window)activate(true);
})();

(()=>{'use strict';
let frame=0;
function fitContents(){frame=0;document.querySelectorAll('.toc-content').forEach(host=>{
 if(!host.clientHeight)return;
 let inner=host.querySelector(':scope > .toc-fit');
 if(!inner){inner=document.createElement('div');inner.className='toc-fit';while(host.firstChild)inner.appendChild(host.firstChild);host.appendChild(inner);}
 inner.style.transform='none';inner.style.width='100%';
 const scale=Math.min(1,(host.clientHeight-2)/Math.max(1,inner.scrollHeight));
 if(scale<.999){inner.style.width=(100/scale)+'%';inner.style.transform='scale('+scale+')';}
 host.scrollTop=0;
});}
function schedule(){if(!frame)frame=requestAnimationFrame(fitContents);}
const book=document.getElementById('book');if(book){new MutationObserver(schedule).observe(book,{childList:true,subtree:true});new ResizeObserver(schedule).observe(book);}
addEventListener('resize',schedule);document.fonts?.ready.then(schedule);schedule();
})();
</script></body></html>
