<script>
const DATA=[{"name": "AI Committee", "coChairs": ["Karena Belin\nFounder & CEO\nKaiBM Ltd.", "Michael Keppe\nCo-Founder & CEO\nImpala Services Ltd. / Pergamon Labs Ltd."], "paragraphs": ["With the publication of the AI Transformation Blueprint in November 2025, GCC became the first and only chamber in Hong Kong to develop and publish a comprehensive guide of this kind, designed by members for members. This joint achievement established the AI Committee as one of the leading expert groups on AI strategy for business in Hong Kong.", "The AI Blueprint – Phase One of GCC’s overall AI strategy – provides a framework for organisations to assess their AI readiness across seven pillars, underpinned by practical AI use cases from leading companies across various industries.", "In 2026, the Committee moved from framework to research, joining forces with the HKU Centre for AI, Management and Organization (CAMO) for Phase Two: the joint AI Maturity Assessment combined 35 targeted questions with diagnostic interviews to identify adoption barriers and develop company-specific action roadmaps.", "As of November 2026, the Committee is preparing to launch Phase Three: the interactive GCC AI Hub. The platform is designed to support knowledge exchange and business matchmaking between GCC members.", "Explore the GCC AI Hub: https://gcchk-ai.com/ [button]"], "photos": [{"file": "committee-selected-20250826_aiwg_meeting_01.jpg", "caption": "26 August 2025 · AI Committee", "source": "11-20250826_AIWG_Meeting_01.jpg", "source_sha256": "775f2ad52498c74d4bcd45b21f98eaa05697a173566320b3c08f21e2bba96ace", "src": "assets/d86aee51784e9d9e218f.jpg", "alt": "26 August 2025 · AI Committee"}, {"file": "committee-selected-20251103_ai_01.jpg", "caption": "3 November 2025 · AI Committee", "source": "12-20251103_AI_01.jpg", "source_sha256": "1af49d509eeebb23c241d0e3f503c941e459040525dd7c8d9e332c8f5babaf59", "src": "assets/29aea0fe94d6c41a82ab.jpg", "alt": "3 November 2025 · AI Committee"}, {"file": "committee-selected-20251103_ai_02.jpg", "caption": "3 November 2025 · AI Committee", "source": "13-20251103_AI_02.jpg", "source_sha256": "59741e2594697ab55ce75c3cc856d0a98eff9c0577c6bccb2a1fa50e205e0dc8", "src": "assets/a5722b4c7a9614e64211.jpg", "alt": "3 November 2025 · AI Committee"}, {"file": "committee-selected-20251210_aiwg.jpg", "caption": "10 December 2025 · AI Committee", "source": "14-20251210_AIWG.jpg", "source_sha256": "ef094475992dde94c1037348751f84828c9db9f0ca3a38035ed6c2df10c921f3", "src": "assets/045536cd6f18ee179f2b.jpg", "alt": "10 December 2025 · AI Committee"}, {"file": "committee-selected-20260309_ai.jpg", "caption": "9 March 2026 · AI Committee", "source": "15-20260309_AI.jpg", "source_sha256": "8053d269c4547ddf2dffe1c1a1d9ecb5f83ef202843da001dc7c5d53a464eee5", "src": "assets/5971ea2c051cb844a79f.jpg", "alt": "9 March 2026 · AI Committee"}, {"file": "committee-selected-20260312_ai.jpg", "caption": "12 March 2026 · AI Committee", "source": "16-20260312_AI.jpg", "source_sha256": "8eecf12b23cfdfdabda702b21857a856fb20a3851aeeda7616b007de6fbc3fc8", "src": "assets/951320525241e8d61c00.jpg", "alt": "12 March 2026 · AI Committee"}], "explanation": "", "chairs": "Karena Belin\nFounder & CEO\nKaiBM Ltd.\n\nMichael Keppe\nCo-Founder & CEO\nImpala Services Ltd. / Pergamon Labs Ltd.", "h1": "", "h2": "", "main": "", "h1img": "", "h2img": ""}, {"name": "Sourcing Committee", "coChairs": ["Markus Hasse-Pratje \nManaging Director\nREWE Far East Ltd.", "Filippo Monti \nManaging Director\nTGI Technology Ltd."], "paragraphs": ["The Sourcing Committee brings together expertise from major multinational retail and wholesale groups as well as long-established family-owned trading companies, reflecting Hong Kong’s important role as a sourcing and supply chain hub for German companies in Asia.", "Discussions throughout 2025-2026 addressed global trade and market developments, regional shifts in sourcing and supply chains, regulatory requirements, and the implications of AI and workforce transformation for the sector. Sustainability and decarbonisation in global value chains were also part of the exchange, as members considered how these developments are affecting sourcing strategies, business operations and longer-term decision-making across Asia.", "The Committee also extended this exchange beyond its membership through joint activities with other international business chambers, providing a broader platform for discussing trade risks, supply chain developments and changes in the global business environment."], "photos": [{"file": "committee-selected-20260121_sourcing.jpg", "caption": "21 January 2026 · Sourcing Committee", "source": "26-20260121_Sourcing.jpg", "source_sha256": "ddb54f4c845ce163f48c6c7103a3048ed14f0f328a42b001f24f59a4de259fa0", "src": "assets/24257801bef3531c514d.jpg", "alt": "21 January 2026 · Sourcing Committee"}, {"file": "committee-selected-20251203_sourcing.jpg", "caption": "3 December 2025 · Sourcing Committee", "source": "27-20251203_Sourcing.jpg", "source_sha256": "548a0941f1130d75eba53b1e0c4cf08d5a8c4ad10ca61cda17e7c31fe340b175", "src": "assets/d947c902fd702911823f.jpg", "alt": "3 December 2025 · Sourcing Committee"}], "explanation": "", "chairs": "Markus Hasse-Pratje \nManaging Director\nREWE Far East Ltd.\n\nFilippo Monti \nManaging Director\nTGI Technology Ltd.", "h1": "", "h2": "", "main": "", "h1img": "", "h2img": ""}, {"name": "ESG Committee", "coChairs": ["Jill Dessel\nProject Manager, Compliance & Regulatory Processes\nREWE Far East Ltd.\n(since September 2026)", "Michael Keppe\nCo-Founder & CEO\nImpala Services Ltd. / Pergamon Labs Ltd.", "Anna Lakotta\nQuality Team Lead\nSimba Dickie HK Ltd.\n(until September 2026)"], "paragraphs": ["Throughout 2025-2026, the ESG Committee met on a monthly schedule to examine how European sustainability requirements are reshaping product development, supply chains and market access.", "Discussions covered the EU Battery Regulation, Packaging and Packaging Waste Regulation (PPWR), Carbon Border Adjustment Mechanism (CBAM), Digital Product Passports (DPP) and Right to Repair requirements, among other developments. Members explored the shared challenges of traceability, supplier data, documentation and compliance planning, connecting regulatory developments with practical business experience.", "We brought these business perspectives to ReThink HK 2025 with a panel on European market expectations. The discussion connected regulatory developments with retailers’ documentation needs and manufacturers’ challenges in gathering consistent data across supply chain tiers. At the 2026 edition, the ESG Committee once again contributed to the programme as a session partner.", "Another important focus of the Committee in 2026 was the development of the ESG Sourcing Hub, which provides timely information on the international regulatory landscape and connects GCC members with relevant ESG-related service providers in our network.", "Explore the ESG Sourcing Hub: https://gcchk-esg.com/"], "photos": [{"file": "committee-selected-20260303_esg.jpg", "caption": "3 March 2026 · ESG Committee", "source": "21-20260303_ESG.jpg", "source_sha256": "8fcb27b1fb8731d674b0cfeae62b8708bb6fbc617fcd1bf6c67af7c1b0b976e9", "src": "assets/ef79cc3f398428f9b8db.jpg", "alt": "3 March 2026 · ESG Committee"}, {"file": "committee-selected-20250911_esg_02.jpg", "caption": "11 September 2025 · ESG Committee", "source": "32-20250911_ESG_02.JPG", "source_sha256": "d6d04389c65a2c2ab6e6c67c121114eb75e9233d36ef6c0484367007e9103bc9", "src": "assets/e523806d233c267ea60a.jpg", "alt": "11 September 2025 · ESG Committee"}, {"file": "committee-selected-20250911_esg_01.jpg", "caption": "11 September 2025 · ESG Committee", "source": "33-20250911_ESG_01.JPG", "source_sha256": "7054b5f70a57790f13e823c3308251f2ed30b2d70e284db263d71d81d618a569", "src": "assets/8f577a6d0b4d537d45fa.jpg", "alt": "11 September 2025 · ESG Committee"}], "explanation": "", "chairs": "Jill Dessel\nProject Manager, Compliance & Regulatory Processes\nREWE Far East Ltd.\n(since September 2026)\n\nMichael Keppe\nCo-Founder & CEO\nImpala Services Ltd. / Pergamon Labs Ltd.\n\nAnna Lakotta\nQuality Team Lead\nSimba Dickie HK Ltd.\n(until September 2026)", "h1": "", "h2": "", "main": "", "h1img": "", "h2img": ""}, {"name": "Women in Business", "coChairs": ["Karena Belin \nFounder & CEO \nKaiBM Ltd.", "Andrea Lorenz \nGeneral Manager Greater China & Southeast Asia\nRichard Wolf Hong Kong Ltd.", "Bing Yan\nHead of Asia LGBS, Lufthansa Group\n(until March 2026)"], "paragraphs": ["Building on its establishment in 2025, the Women in Business Committee continued to develop as a platform for exchange on the opportunities and challenges women encounter throughout their professional careers over the past year.", "Leadership emerged as a central theme, ranging from executive readiness and the development of leadership potential to the influence of cultural context on leadership, communication and career experiences. Members exchanged perspectives on perceptions of women in leadership, bias and changing expectations across different professional and cultural environments. Women’s health and workplace benefits added another dimension, including gaps in health insurance coverage, women-specific healthcare needs and the importance of more flexible and inclusive employee benefits.", "Through these exchanges, the Committee continues to provide an open forum for members to share experiences and perspectives across industries and career stages, while addressing both individual career development and broader workplace conditions affecting women."], "photos": [{"file": "committee-selected-20260528_wib.jpg", "caption": "28 May 2026 · Women in Business", "source": "20-20260528_WiB.JPG", "source_sha256": "23b45550afcd26857549a23c83af76c87d3b240936be65577a74b0ce6d9619d8", "src": "assets/b5274c1d61dbca38f3d2.jpg", "alt": "28 May 2026 · Women in Business"}, {"file": "committee-selected-20260127_wib.jpg", "caption": "27 January 2026 · Women in Business", "source": "23-20260127_WiB.png", "source_sha256": "a929c1d200766543e4d8bc1de4cdae3bdaa4e8bf05fb952f55d5799c8c9de327", "src": "assets/ae68f71ccde6baf24e38.jpg", "alt": "27 January 2026 · Women in Business"}, {"file": "committee-selected-20251112_wib.jpg", "caption": "12 November 2025 · Women in Business", "source": "28-20251112_WIB.jpg", "source_sha256": "df9876171d6ee847e5d30099f38ee857ed97912bedaa2aed98a962df35fc71ed", "src": "assets/979d0e65a295472174b9.jpg", "alt": "12 November 2025 · Women in Business"}], "explanation": "", "chairs": "Karena Belin \nFounder & CEO \nKaiBM Ltd.\n\nAndrea Lorenz \nGeneral Manager Greater China & Southeast Asia\nRichard Wolf Hong Kong Ltd.\n\nBing Yan\nHead of Asia LGBS, Lufthansa Group\n(until March 2026)", "h1": "", "h2": "", "main": "", "h1img": "", "h2img": ""}, {"name": "Mittelstand Committee", "coChairs": ["Stefan Klindwort \nManaging Director\nKK Food Trading Co. Ltd.", "Stefan Kracht \nPartner & Group Integration Director\nAcclime"], "paragraphs": ["The Mittelstand Committee provides family-run small and medium-sized enterprises with a platform to exchange perspectives on economic developments, operational challenges and the impact of AI transformation on their businesses.", "Discussions throughout 2025-2026 covered regional manufacturing and supply chain strategies, including the characteristics, complexities and strategic advantages of different production locations across Asia. Talent and leadership were another recurring focus, particularly changing workforce expectations, attracting and retaining talent, and the evolving leadership capabilities required in a changing business environment. Digitalisation and AI were increasingly reflected across these discussions as companies considered how technology is changing their operations, workforce and competitiveness.", "The Committee thus continues to offer a valuable forum for practical exchange, enabling members to share experiences and approaches to common challenges facing Mittelstand companies in Hong Kong and the wider region."], "photos": [{"file": "committee-selected-sme_meeting.jpg", "caption": "Mittelstand Committee", "source": "34-SME_Meeting.JPG", "source_sha256": "54a2691fa884f72e7a0ffd89dc706fb466d17ed81238338202e6577f1bcdb422", "src": "assets/4389f54831fb38eb5b5d.jpg", "alt": "Mittelstand Committee"}], "explanation": "", "chairs": "Stefan Klindwort \nManaging Director\nKK Food Trading Co. Ltd.\n\nStefan Kracht \nPartner & Group Integration Director\nAcclime", "h1": "", "h2": "", "main": "", "h1img": "", "h2img": ""}, {"name": "Logistics Committee", "coChairs": ["Eric Reuter\nCEO Asia Pacific\nWoodland Group (HK) Ltd.", "Helen Tse\nDirector South China, Hong Kong, Taiwan\nLufthansa Cargo"], "paragraphs": ["The Logistics Committee is aimed at representatives from freight forwarders, carriers, and logistics service providers. Key topics include digitalisation, sustainability and new cargo infrastructure developments in the Greater Bay Area.", "In 2025-2026, the Committee moved beyond regular boardroom meetings to bring members closer to the operations shaping regional supply chains. Following an insightful exchange with IATA on air cargo market developments, the Committee set the direction for more interactive site visits in 2026.", "In January, we an Executive Greater Bay Area tour with the German Chamber of Commerce in China | South & Southwest brought members to the International Cargo Centre Shenzhen (ICCS) at Shenzhen Bao’an International Airport. The visit offered a first-hand view of cross-border cargo connectivity, followed by further exchange at a networking cocktail in Shekou.", "A visit to Modern Terminals in June connected Hong Kong’s role as a transshipment hub with the operational coordination and decarbonisation shaping modern port strategy. A shipside visit to a 366-metre container vessel brought the scale of these operations into focus.", "We greatly appreciate our hosts, partners and active members for making these excursions possible and contributing their experience to the exchanges. More to come in 2027!"], "photos": [{"file": "committee-selected-20260609_logistics.jpg", "caption": "9 June 2026 · Logistics Committee", "source": "19-20260609_Logistics.jpg", "source_sha256": "c7021da78c03e511173eb457e412bf160ce7cae3d42f0fa86ee374b43c2a88d5", "src": "assets/2ca26a3a40b33cbaaa66.jpg", "alt": "9 June 2026 · Logistics Committee"}, {"file": "committee-selected-20260127_logistics_02.jpg", "caption": "27 January 2026 · Logistics Committee", "source": "24-20260127_Logistics_02.jpg", "source_sha256": "e7ab9301078356275db6a53306f640e261d46f9bb396dcf81000b766b151899a", "src": "assets/8faa5bd064a032bd3da2.jpg", "alt": "27 January 2026 · Logistics Committee"}, {"file": "committee-selected-20260127_logistics_01.jpg", "caption": "27 January 2026 · Logistics Committee", "source": "25-20260127_Logistics_01.jpg", "source_sha256": "5c5c1104559c63d2425cb4a0114ceb96c19c780fb88a361a8693c74a7a566a0d", "src": "assets/f18f1532088d07a671ac.jpg", "alt": "27 January 2026 · Logistics Committee"}, {"file": "committee-selected-20250917_logistics.jpg", "caption": "17 September 2025 · Logistics Committee", "source": "31-20250917_Logistics.jpg", "source_sha256": "7df0e6a3bf571c5d9d2c7276435d3d2ee13d8897dc7f8dd95e5e73345b7ca3ba", "src": "assets/842043784cffbb0b49b3.jpg", "alt": "17 September 2025 · Logistics Committee"}], "explanation": "", "chairs": "Eric Reuter\nCEO Asia Pacific\nWoodland Group (HK) Ltd.\n\nHelen Tse\nDirector South China, Hong Kong, Taiwan\nLufthansa Cargo", "h1": "", "h2": "", "main": "", "h1img": "", "h2img": ""}, {"name": "CFO Committee", "coChairs": ["Hauke Otten\nFounder\nFINNTER Consulting and Advisory Services", "Christoph Panschog\nHead of Corporate Finance\nRieckermann (Hong Kong) Ltd.\n(since October 2026)", "Bing Yan\nHead of Asia LGBS\nLufthansa Group\n(until October 2026)"], "paragraphs": ["The CFO Committee brings together senior executives from finance and controlling departments and provides a platform for discussion on regulatory developments, digital transformation and sustainability trends.", "Over the past year, the CFO Committee focused on practical responses to financial risk and the growing complexity of international business. Together with Deloitte, members explored the customs and tax implications of rising tariffs, shifting trade barriers, and complex global supply chains, as well as measures companies could consider in response to regulatory, technological and market pressures.", "During a session with Dr. John Wong and Douglas Chan of ai-CapSupremo Capital, the Committee examined commodity and currency exposure through AI-driven hedging tools and quantitative models. Discussions covered how data and automation could support more disciplined, responsive hedging and the practical adoption of these tools by treasury and finance teams.", "We greatly appreciate the insights and contributions from all members and guest speakers that help make these regular high-level exchanges so meaningful."], "photos": [{"file": "committee-selected-20260210_cfo.jpg", "caption": "10 February 2026 · CFO Committee", "source": "22-20260210_CFO.jpg", "source_sha256": "5168088f8e78d3eeb09b7c09c2d9e60ab298ba418173738851857e5a26a60100", "src": "assets/8be807a35294b2191bff.jpg", "alt": "10 February 2026 · CFO Committee"}, {"file": "committee-selected-20251024_cfo.jpg", "caption": "24 October 2025 · CFO Committee", "source": "29-20251024_CFO.jpg", "source_sha256": "aa175bb2e94439b87e0b22451af2c741a7ba7fe7dc6acd32f47d3f4898285d39", "src": "assets/236c287b9e2715e08b5a.jpg", "alt": "24 October 2025 · CFO Committee"}], "explanation": "", "chairs": "Hauke Otten\nFounder\nFINNTER Consulting and Advisory Services\n\nChristoph Panschog\nHead of Corporate Finance\nRieckermann (Hong Kong) Ltd.\n(since October 2026)\n\nBing Yan\nHead of Asia LGBS\nLufthansa Group\n(until October 2026)", "h1": "", "h2": "" const stage=document.getElementById('stage');

shops.forEach((shop,i)=>{const b=document.createElement('button');b.type='button';b.textContent=shop.getAttribute('aria-label');b.addEventListener('click',()=>{openShop(i);stage.scrollIntoView({block:'start'});});mobileNav.appendChild(b);});stage.after(mobileNav);
const leftPanel=document.getElementById('leftPanel');
const rightPanel=document.getElementById('rightPanel');
const singlePanel=document.getElementById('singlePanel');
const shopPrompt=document.querySelector('.shop-prompt');
let active=-1;
const SPLIT_INDICES=new Set([3,4]);
const clean=t=>(t||'').trim();
const photoOnly=t=>{const x=clean(t).toLowerCase();return !x||x==='no highlight'||x==='another photo of the committee';};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const img=(src,cls='photo',alt='Committee photograph')=>src?`<img class="${cls}" src="${src}" alt="${esc(alt)}">`:'';
function closeBtn(){return '<button class="close" type="button" aria-label="Close information">×</button>';}
function closePanels(){active=-1;shops.forEach(s=>s.classList.remove('selected'));[leftPanel,rightPanel,singlePanel].forEach(p=>{p.classList.remove('open','single-left','single-right');p.innerHTML='';});if(shopPrompt) shopPrompt.classList.remove('hidden');}
function parseContent(c){
  const items=[{text:c.h1,src:c.h1img},{text:c.h2,src:c.h2img}];
  const highlights=[]; const extras=[];
  items.forEach(item=>{if(photoOnly(item.text)){if(item.src) extras.push(item.src);}else{highlights.push(item);}});
  return {highlights,extras};
}
function committeeMedia(c,includeExtras=true){
  const {extras}=parseContent(c);
  const photos=[];
  if(c.main) photos.push({src:c.main,alt:c.name+' group photo'});
  if(includeExtras) extras.forEach((src,i)=>photos.push({src,alt:c.name+' additional committee photo '+(i+1)}));
  if(!photos.length) return '';
  return `<div class="committee-media">${photos.map((p,i)=>img(p.src,(i===0?'photo main-photo':'photo'),p.alt)).join('')}</div>`;
}
function extraPhotosMarkup(c){
  const {extras}=parseContent(c);
  if(!extras.length) return '';
  return `<div class="committee-media">${extras.map((src,i)=>img(src,'photo',c.name+' additional committee photo '+(i+1))).join('')}</div>`;
}
function highlightMarkup(c){
  const {highlights}=parseContent(c);
  return highlights.map((h,i)=>`<article class="article"><p>${esc(h.text)}</p>${img(h.src,'photo',c.name+' highlight photograph '+(i+1))}</article>`).join('');
}
function splitTextMarkup(c){
  const {highlights}=parseContent(c);
  const highlightText=highlights.map(h=>`<article class="article"><p>${esc(h.text)}</p></article>`).join('');
  return `<div class="panel-scroll split-text">${closeBtn()}<h2>${esc(c.name)}</h2><p>${esc(c.explanation)}</p><div class="chairs"><strong>Group Leads / Chairs</strong><div>${esc(c.chairs)}</div></div>${highlightText}</div>`;
}
function splitPhotoMarkup(c){
  const {highlights,extras}=parseContent(c);
  const photos=[];
  if(c.main) photos.push({src:c.main,alt:c.name+' group photo'});
  highlights.forEach((h,i)=>{if(h.src) photos.push({src:h.src,alt:c.name+' highlight photograph '+(i+1)});});
  extras.forEach((src,i)=>photos.push({src,alt:c.name+' additional committee photo '+(i+1)}));
  return `<div class="panel-scroll">${closeBtn()}<div class="split-photo-stack">${photos.map(p=>img(p.src,'photo',p.alt)).join('')}</div></div>`;
}
function singleMarkup(c){
 const photos=c.photos||[];
 const chairs=(c.coChairs||[]).map(text=>{const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);return `<article class="cochair-card"><h3>${esc(lines.shift()||'')}</h3><p>${lines.map(esc).join('<br>')}</p></article>`;}).join('');
 const copy=(c.paragraphs||[]).map(text=>{
   const link=text.match(/https:\/\/[^\s]+/);
   if(link)return `<p><a class="committee-hub-link" href="${esc(link[0])}" target="_blank" rel="noopener noreferrer">${esc(text.split('https:')[0].replace(/:\s*$/,''))} ↗</a></p>`;
   return `<p>${esc(text)}</p>`;
 }).join('');
 const gallery=photos.length?`<div class="report-photo-carousel committee-photo-carousel" tabindex="0" role="region" aria-roledescription="carousel" aria-label="${esc(c.name)} photographs"><div class="report-photo-frame"><img data-photo-image src="${photos[0].src}" alt="${esc(photos[0].alt)}"><button class="report-photo-prev" data-photo-prev type="button" aria-label="Previous photograph">‹</button><button class="report-photo-next" data-photo-next type="button" aria-label="Next photograph">›</button><span class="report-photo-count" data-photo-count aria-live="polite" ${photos.length===1?'hidden':''}>1 / ${photos.length}</span><small class="committee-photo-credit">© GIC/GCC</small></div><p class="report-photo-caption" data-photo-caption></p><script type="application/json" data-photo-items>${JSON.stringify(photos).replace(/</g,'\\u003c')}<\/script></div>`:'';
 return `<div class="panel-scroll"><header class="panel-heading"><h2 id="committee-popup-title">${esc(c.name)}</h2>${closeBtn()}</header><div class="committee-popup-columns"><div class="committee-popup-left"><section class="committee-cochairs" aria-label="Committee Co-Chairs"><h3>Committee Co-Chairs</h3><div class="cochair-grid">${chairs}</div></section><div class="committee-popup-copy" tabindex="0" role="region" aria-label="Committee review">${copy}</div></div><div class="committee-popup-photos">${gallery}</div></div></div>`;
}

function bindClose(panel){const b=panel.querySelector('.close');if(b)b.addEventListener('click',e=>{e.stopPropagation();closePanels();});}
function openShop(i){
  if(active===i){closePanels();return;}
  closePanels();active=i;shops[i].classList.add('selected');if(shopPrompt) shopPrompt.classList.add('hidden');const c=DATA[i];const split=false;
  if(split){leftPanel.innerHTML=splitTextMarkup(c);rightPanel.innerHTML=splitPhotoMarkup(c);leftPanel.classList.add('open');rightPanel.classList.add('open');bindClose(leftPanel);bindClose(rightPanel);}
  else{singlePanel.innerHTML=singleMarkup(c);const panelSide=(i===2||i<=1)?'single-right':'single-left';/* Sustainability on the right, Logistics on the left, Women in Business + Mittelstand split only */singlePanel.classList.add(panelSide,'open');bindClose(singlePanel);}
}
shops.forEach((s,i)=>{
  s.addEventListener('click',e=>{e.stopPropagation();openShop(i);});
});
stage.addEventListener('click',e=>{if(active>=0&&!e.target.closest('.panel')&&!e.target.closest('.shop'))closePanels();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active>=0){const i=active;closePanels();shops[i].focus();}});
const originalOpenShop=openShop;openShop=function(i){originalOpenShop(i);const panel=document.querySelector('.panel.open');if(panel){requestAnimationFrame(()=>panel.querySelector('.close')?.focus({preventScroll:true}));}};
</script>

</script><script>(()=>{'use strict';
window.ReportPhotoGallery=function(element,options={}){
 if(!element)return null;
 if(element.reportPhotoGallery){if(options.items)element.reportPhotoGallery.setItems(options.items,options.index||0);return element.reportPhotoGallery;}
 const image=element.querySelector('[data-photo-image]'),counter=element.querySelector('[data-photo-count]'),previous=element.querySelector('[data-photo-prev]'),next=element.querySelector('[data-photo-next]'),caption=element.querySelector('[data-photo-caption]');let items=[],index=0;
 function show(value){if(!items.length)return;index=(value+items.length)%items.length;const item=items[index];image.src=item.src;image.alt=item.alt||'Report photograph';image.style.objectPosition=item.position||'50% 35%';counter.textContent=(index+1)+' / '+items.length;counter.hidden=items.length<2;if(caption)caption.textContent=item.caption||'';element.dataset.photoIndex=String(index);previous.hidden=next.hidden=items.length<2;options.onChange?.(item,index);requestAnimationFrame(fitPhotoFrame);}
 function fitPhotoFrame(){
  const frame=element.querySelector('.report-photo-frame');if(!frame||element.hidden||!element.clientWidth)return;
  const cap=caption&&!caption.hidden&&!options.overlayCaption?caption.offsetHeight+parseFloat(getComputedStyle(caption).marginTop||0)+parseFloat(getComputedStyle(caption).marginBottom||0):0;
  const availableHeight=Math.max(0,element.clientHeight-cap);const width=Math.min(element.clientWidth,availableHeight>0?availableHeight*1.5:element.clientWidth);
  frame.style.setProperty('--gallery-photo-width',width+'px');frame.style.setProperty('--gallery-photo-height',(width/1.5)+'px');
 }
 const sizeObserver=new ResizeObserver(()=>requestAnimationFrame(fitPhotoFrame));sizeObserver.observe(element);
 function setItems(value,start=0){items=Array.isArray(value)?value:[];element.hidden=!items.length;if(items.length)show(start);}
 previous.addEventListener('click',()=>show(index-1));next.addEventListener('click',()=>show(index+1));
 element.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();event.stopPropagation();show(index+(event.key==='ArrowRight'?1:-1));}});
 const api={show,setItems,get index(){return index;},get count(){return items.length;}};element.reportPhotoGallery=api;
 let initial=options.items;if(!initial){const node=element.querySelector('[data-photo-items]');initial=node?JSON.parse(node.textContent):[];}
 setItems(initial,options.index||0);return api;
};
})();

(()=>{'use strict';
const taxi=document.querySelector('.street-taxi');if(!taxi)return;
const stage=document.getElementById('stage'),reduced=matchMedia('(prefers-reduced-motion:reduce)');let active=false,clock=0,last=0,frame=0;
function draw(){const phase=clock<30?-1:(clock-30)%30,visible=phase>=0&&phase<8.5;taxi.style.opacity=visible?'.96':'0';if(visible)taxi.style.transform='translate3d('+((-0.62+1.85*phase/8.5)*stage.clientWidth).toFixed(2)+'px,33.333%,0)';}
function tick(now){frame=0;if(!active||document.hidden||reduced.matches){last=0;return;}if(last)clock+=Math.min(.12,(now-last)/1000);last=now;draw();frame=requestAnimationFrame(tick);}
function sync(){if(frame){cancelAnimationFrame(frame);frame=0;}last=0;if(active&&!document.hidden&&!reduced.matches)frame=requestAnimationFrame(tick);}
addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='gcc-committees:active'){active=!!event.data.active;sync();}});document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',sync);addEventListener('resize',draw);
